<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>世界刻薄榜前3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Poppins', 'Helvetica Neue', sans-serif;
        }

        /* ===== 背景图片：替换下方 url 即可 ===== */
        body {
            background-image: url('https://picsum.photos/id/104/1920/1080');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 240, 245, 0.65);
            backdrop-filter: blur(2px);
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 2.5rem;
            padding: 1rem 0;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 80px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(210, 180, 220, 0.4);
        }

        .hero h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #F6A7C1, #7DC4FF);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 2px 2px 12px rgba(255, 220, 240, 0.6);
            font-weight: 800;
        }

        .hero p {
            color: #4a627a;
            font-size: 0.9rem;
            margin-top: 8px;
            font-weight: 500;
            background: rgba(255, 255, 240, 0.5);
            display: inline-block;
            padding: 4px 16px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 2rem;
            margin-top: 1rem;
        }

        .card {
            background: rgba(255, 250, 245, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 1.5rem 1.3rem 1.8rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2);
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 210, 230, 0.8);
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 252, 245, 0.92);
            box-shadow: 0 25px 40px -14px rgba(100, 80, 120, 0.25);
            border-color: #ffbfd5;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid #ffc0db;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .card-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(145deg, #E98DB3, #5BA9E8);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .icon-badge {
            font-size: 2rem;
        }

        .list-container {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .record-item {
            background: white;
            border-radius: 20px;
            padding: 12px 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            transition: 0.1s;
            border: 1px solid #ffe2ef;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .record-left {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px 12px;
            flex: 3;
            min-width: 160px;
        }

        .record-name {
            font-weight: 700;
            color: #a15072;
            background: #ffe8f0;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.85rem;
            display: inline-block;
            white-space: nowrap;
        }

        .record-link {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.85rem;
            flex: 1;
            min-width: 120px;
        }

        .record-link a {
            text-decoration: none;
            color: #3A6EA5;
            font-weight: 500;
            border-bottom: 1px dotted #ffa7c2;
        }

        .record-link a:hover {
            color: #d4558a;
            border-bottom: 1px solid #d4558a;
        }

        .screenshot-preview {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            width: 100%;
            margin-top: 5px;
        }

        .screenshot-img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 12px;
            background: #f2eef5;
            border: 1px solid #ffc0db;
        }

        .record-meta {
            font-size: 0.7rem;
            color: #b3849b;
            word-break: break-all;
        }

        .empty-msg {
            text-align: center;
            color: #c49ab0;
            padding: 20px;
            font-style: italic;
            font-size: 0.8rem;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.7rem;
            color: #b5a0ae;
            background: rgba(255, 250, 245, 0.7);
            backdrop-filter: blur(5px);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            padding: 8px 28px;
            border-radius: 60px;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #ffecf0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #ffb7ce;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>⚔️ 世界刻薄榜前3 ⚔️</h1>
        </div>

        <div class="dashboard">
            <!-- 微博板块 -->
            <div class="card">
                <div class="card-header">
                    <span class="icon-badge">🐦‍⬛</span>
                    <h2>微博</h2>
                </div>
                <div class="list-container" id="weiboList"></div>
            </div>

            <!-- 抖音 + 小红书板块 -->
            <div class="card">
                <div class="card-header">
                    <span class="icon-badge">🎵</span>
                    <h2>抖音，小红书</h2>
                </div>
                <div class="list-container" id="douyinList"></div>
            </div>

            <!-- 其他板块（截屏记录） -->
            <div class="card">
                <div class="card-header">
                    <span class="icon-badge">📸</span>
                    <h2>其他</h2>
                </div>
                <div class="list-container" id="screenshotList"></div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // ★★★ 在这里手动编辑您的所有数据（完全静态，无任何上传功能） ★★★
        // ================================================================

        // 微博数据
        const WEIBO_DATA = [
            { name: '小方块', link: 'https://weibo.com/u/6317334286' },
            { name: '小方块2', link: 'https://m.weibo.cn/u/7912713088?wm=3333_2001&from=10G6193010&sourcetype=weixin&s_trans=ooVVStUv99BzgusraXoKIg%3D%3D__s&s_channel=4' },
            { name: 'gqy', link: 'https://weibo.com/u/6581348518' },
            { name: 'ttx', link: 'https://weibo.com/u/7856889699' },
        ];

        // 抖音 + 小红书数据
        const DOUYIN_DATA = [
            { name: 'lyl小红书', link: 'https://www.xiaohongshu.com/user/profile/5cbd5ca40000000017000dce?xsec_token=ABdqsNSB8prkCsPEX9V0lx_JyCDcQjjJjOnRMq0l2-1qk%3D&xsec_source=pc_search' },
            { name: 'lzx小红书', link: 'https://xhslink.com/m/887OODuWucs' },
            { name: 'czc抖音小号账号', link: 'https://cxihuanbaishanch/' },
            { name: '小方块ins账号名', link: 'https://w_o31i/' },
        ];

        // 截屏记录数据（已修正空值写法）
        const SCREENSHOT_DATA = [
            {
                name: 'tpy天上飞',
                socialLink: 'https://v.douyin.com/r3PzUA_QlvE/',
                imgUrl: '',
                remark: ''
            },
            {
                name: '长梅成绩单',
                socialLink: 'https://www.douyin.com/user/xxxx888',
                imgUrl: 'https://picsum.photos/id/26/100/100',
                remark: '阴阳怪气名场面'
            },
        ];

        // ================================================================
        // 以下为渲染代码，您无需修改
        // ================================================================

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function sanitizeUrl(url) {
            if (!url) return "";
            url = url.trim();
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                return 'https://' + url;
            }
            return url;
        }

        function renderWeibo() {
            const container = document.getElementById('weiboList');
            if (!container) return;
            if (WEIBO_DATA.length === 0) {
                container.innerHTML = `<div class="empty-msg">🐣 暂无微博目标</div>`;
                return;
            }
            let html = '';
            WEIBO_DATA.forEach(item => {
                const name = escapeHtml(item.name) || '未命名';
                const link = item.link || '';
                const safeLink = sanitizeUrl(link);
                const displayLink = link.length > 40 ? link.substring(0, 37) + '...' : link;
                html += `
                    <div class="record-item">
                        <div class="record-left">
                            <span class="record-name">${name}</span>
                            <div class="record-link">
                                <a href="${safeLink}" target="_blank" rel="noopener noreferrer">📱 ${displayLink}</a>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderDouyin() {
            const container = document.getElementById('douyinList');
            if (!container) return;
            if (DOUYIN_DATA.length === 0) {
                container.innerHTML = `<div class="empty-msg">🎭 暂无目标</div>`;
                return;
            }
            let html = '';
            DOUYIN_DATA.forEach(item => {
                const name = escapeHtml(item.name) || '未命名';
                const link = item.link || '';
                const safeLink = sanitizeUrl(link);
                const displayLink = link.length > 40 ? link.substring(0, 37) + '...' : link;
                html += `
                    <div class="record-item">
                        <div class="record-left">
                            <span class="record-name">${name}</span>
                            <div class="record-link">
                                <a href="${safeLink}" target="_blank" rel="noopener noreferrer">🎥 ${displayLink}</a>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderScreenshot() {
            const container = document.getElementById('screenshotList');
            if (!container) return;
            if (SCREENSHOT_DATA.length === 0) {
                container.innerHTML = `<div class="empty-msg">📭 暂无记录</div>`;
                return;
            }
            let html = '';
            SCREENSHOT_DATA.forEach(record => {
                const name = escapeHtml(record.name) || '未命名';
                const socialLink = record.socialLink || '';
                const safeLink = sanitizeUrl(socialLink);
                const displayLink = socialLink.length > 40 ? socialLink.substring(0, 37) + '...' : socialLink;
                const imgUrl = record.imgUrl ? record.imgUrl.trim() : '';
                const remarkText = record.remark ? escapeHtml(record.remark) : '无备注';

                html += `
                    <div class="record-item" style="flex-direction: column; align-items: flex-start;">
                        <div style="display: flex; width: 100%; justify-content: space-between; align-items: center;">
                            <div class="record-left" style="flex: 1;">
                                <span class="record-name">${name}</span>
                                <div class="record-link" style="flex: 1;">
                                    <a href="${safeLink}" target="_blank" rel="noopener noreferrer">🔗 ${displayLink}</a>
                                </div>
                            </div>
                        </div>
                        <div class="screenshot-preview">
                            ${imgUrl ? `<img class="screenshot-img" src="${imgUrl}" alt="截屏证据" onerror="this.onerror=null;this.src='https://via.placeholder.com/48x48?text=图片失效';" loading="lazy">` : `<div class="screenshot-img" style="background:#efdbeb; display:flex; align-items:center; justify-content:center; font-size:10px;">无图</div>`}
                            <div class="record-meta">📝 ${remarkText}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        renderWeibo();
        renderDouyin();
        renderScreenshot();

        console.log('%c✨ 纯静态展示模式 | 所有数据在代码开头的数组中编辑', 'color:#E98DB3;font-size:14px;');
    </script>
</body>
</html>
